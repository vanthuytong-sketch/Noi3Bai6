    const contentArea = document.getElementById('content-area');
    let currentUtterance = null;

    function initVoice() {
        if (!window.speechSynthesis) return;
        let voices = window.speechSynthesis.getVoices();
        
        // Cực kỳ nghiêm ngặt: Chỉ lọc giọng phổ thông chuẩn Đại lục (zh-CN)
        allZhVoices = voices.filter(v => v.lang === 'zh-CN' || v.lang === 'zh-Hans-CN' || v.name.includes('普通话') || v.name.includes('Mainland'));
        
        // Ưu tiên theo thứ tự: Giọng Google chuẩn nhất -> Giọng Edge chuẩn nhất
        chineseVoice = allZhVoices.find(v => v.name === 'Google 普通话') 
                    || allZhVoices.find(v => v.name.includes('Xiaoxiao') && v.name.includes('Neural')) 
                    || allZhVoices.find(v => v.name.includes('Yunxi') && v.name.includes('Neural'))
                    || allZhVoices.find(v => v.name.includes('Yunjian'))
                    || allZhVoices.find(v => v.name.includes('Xiaoxiao'))
                    || allZhVoices.find(v => v.name.includes('Ting-Ting'))
                    || allZhVoices[0];

        populateVoiceSelect();
    }

    function populateVoiceSelect() {
        const selectEl = document.getElementById('voice-select');
        if (!selectEl) return;
        
        selectEl.innerHTML = '';
        if(allZhVoices.length === 0) {
            selectEl.innerHTML = '<option>未找到标准中文语音 (Không tìm thấy giọng chuẩn)</option>';
            return;
        }
        
        allZhVoices.forEach((v, index) => {
            const option = document.createElement('option');
            option.value = index;
            option.textContent = v.name.replace('Microsoft ', '').replace('Online (Natural) - Chinese (Mainland)', 'AI') + ' (' + v.lang + ')';
            if (chineseVoice && v.name === chineseVoice.name) {
                option.selected = true;
            }
            selectEl.appendChild(option);
        });
    }

    function changeVoice() {
        const selectEl = document.getElementById('voice-select');
        if (selectEl && allZhVoices[selectEl.value]) {
            chineseVoice = allZhVoices[selectEl.value];
        }
    }

    if(window.speechSynthesis) {

    function getPinyinArray(text) {
        if (typeof pinyinPro === 'undefined') return text.split('');
        try {
            return pinyinPro.pinyin(text, { type: 'array', toneType: 'num', v: true });
        } catch (e) {
            return text.split('');
        }
    }

    function checkPhonetic(target, transcript) {
        if (typeof pinyinPro === 'undefined') return { isPerfectPhonetic: false, errors: 999, details: [] };
        
        let kwArr = getPinyinArray(target);
        let trArr = getPinyinArray(transcript);
        
        let kwInitials = pinyinPro.pinyin(target, { pattern: 'initial', type: 'array' });
        let trInitials = pinyinPro.pinyin(transcript, { pattern: 'initial', type: 'array' });
        
        let kwFinals = pinyinPro.pinyin(target, { pattern: 'final', type: 'array' });
        let trFinals = pinyinPro.pinyin(transcript, { pattern: 'final', type: 'array' });

        let bestMatchErrors = 999;
        let bestMatchDetails = [];
        let isPerfectPhonetic = false;

        if (trArr.length < kwArr.length) {
            return { isPerfectPhonetic: false, errors: 999, details: ["漏读 (您读的字数不够)"] };
        }

        for (let i = 0; i <= trArr.length - kwArr.length; i++) {
            let errors = 0;
            let details = [];
            for (let j = 0; j < kwArr.length; j++) {
                let kt = kwArr[j] || "";
                let rt = trArr[i+j] || "";
                if (kt !== rt) {
                    errors++;
                    let k_i = kwInitials[j] || ""; let r_i = trInitials[i+j] || "";
                    let k_f = kwFinals[j] || "";   let r_f = trFinals[i+j] || "";
                    let k_b = kt.replace(/\d/g, ''); let r_b = rt.replace(/\d/g, '');

                    let errStr = "";
                    if (k_b === r_b && kt !== rt) errStr = "声调错误 (Sai thanh điệu)";
                    else if (k_i !== r_i && k_f === r_f) errStr = "声母错误 (Sai thanh mẫu)";
                    else if (k_i === r_i && k_f !== r_f) errStr = "韵母错误 (Sai vận mẫu)";
                    else errStr = "发音错误 (Sai phát âm)";

                    details.push(`字 "<b>${target[j]}</b>" ${errStr} (系统听到: ${transcript[i+j]} - ${rt})`);
                }
            }
            if (errors < bestMatchErrors) {
                bestMatchErrors = errors;
                bestMatchDetails = details;
            }
            if (errors === 0) {
                isPerfectPhonetic = true;
                break;
            }
        }

        return {
            isPerfectPhonetic: isPerfectPhonetic,
            errors: bestMatchErrors,
            details: bestMatchDetails
        };
    }

        window.activeQIndex = activePracticeIndex;
        
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        practiceRec = new SR();
        practiceRec.lang = 'zh-CN';
        practiceRec.continuous = false; 
        practiceRec.interimResults = false;
        
        const btn = document.getElementById('btn-pmic-' + index);
        const resEl = document.getElementById('res-' + index);
        
        if(btn) {
            btn.classList.replace('bg-blue-600', 'bg-red-500');
            btn.classList.replace('hover:bg-blue-700', 'hover:bg-red-600');
            btn.classList.add('mic-active-icon');
            btn.innerHTML = '<i class="fas fa-wave-square mr-2"></i> 正在聆听...';
        }
        
        if(resEl) {
            resEl.innerHTML = "<span class='text-blue-600 font-bold flex items-center'><i class='fas fa-circle-notch fa-spin mr-3 text-xl'></i> 等待你的回答...</span>";
            resEl.className = "bg-blue-50 p-4 rounded-xl border border-blue-200 mt-2 shadow-inner min-h-[50px] transition-all";
        }
        
        practiceRec.onresult = function(event) {
            const transcript = event.results[0][0].transcript;
            processPracticeTranscript(transcript, activePracticeIndex);
        };
        
        practiceRec.onerror = function(event) {
            if(resEl) {
                resEl.innerHTML = `<span class='text-red-600 font-bold'><i class='fas fa-exclamation-circle mr-2'></i>听不清楚，请重试！</span>`;
                resEl.className = "bg-red-50 p-4 rounded-xl border border-red-200 mt-2 shadow-inner min-h-[50px] transition-all";
            }
            resetPracticeMicBtn(activePracticeIndex);
        };
        
        practiceRec.onend = function() {
            resetPracticeMicBtn(activePracticeIndex);
        };
        
        try { practiceRec.start(); } catch(e) {}
    }

    function resetPracticeMicBtn(index) {
        const btn = document.getElementById('btn-pmic-' + index);
        if(btn) {
            btn.classList.replace('bg-red-500', 'bg-blue-600');
            btn.classList.replace('hover:bg-red-600', 'hover:bg-blue-700');
            btn.classList.remove('mic-active-icon');
            btn.innerHTML = '<i class="fas fa-microphone mr-2"></i> 点击录音';
        }
    }

    function processPracticeTranscript(transcript, index) {
        const exercises = appData[window.currentPracticeLesson][window.currentPracticeKey];
        if (index >= exercises.length) return;
        
        const currentQ = exercises[index];
        const resEl = document.getElementById('res-' + index);
        
        let cleanText = transcript.replace(/[。，？！、\s]/g, '').trim();
        
        let displayPinyin = "";
        try {
            if (typeof pinyinPro !== 'undefined') {
                displayPinyin = pinyinPro.pinyin(cleanText, { toneType: 'symbol' }); 
            }
        } catch(e) {}
        
        let possibleTargets = currentQ.a.split('|').map(t => t.replace(/[\s]/g, ''));
        let matchedTargetLength = 0;
        let isMatch = false;
        
        let bestPhoneticFeedback = null;
        let lowestErrors = 999;
        
        for (let target of possibleTargets) {
            if (cleanText.includes(target)) {
                isMatch = true;
                matchedTargetLength = target.length;
                bestPhoneticFeedback = null;
                break;
            } 
            else {
                let pinyinCheck = checkPhonetic(target, cleanText);
                
                if (pinyinCheck.isPerfectPhonetic) {
                    isMatch = true;
                    matchedTargetLength = target.length;
                    bestPhoneticFeedback = null;
                    break;
                } else if (pinyinCheck.errors < lowestErrors) {
                    lowestErrors = pinyinCheck.errors;
                    if (pinyinCheck.errors <= Math.max(1, Math.floor(target.length / 2))) {
                        bestPhoneticFeedback = pinyinCheck.details.join("<br> • ");
                    } else {
                        bestPhoneticFeedback = null;
                    }
                }
            }
        }
        
        let heardHtml = `
            <div class="mb-2 text-sm text-gray-700 bg-white p-3 rounded-lg border border-gray-200 shadow-sm">
                <div class="text-xs text-gray-400 mb-1">系统识别结果 (Kết quả hệ thống nghe得)：</div>
                <div class="font-bold text-base tracking-wide">${cleanText}</div>
                <div class="text-xs text-blue-600 mt-1 tracking-wider">${displayPinyin}</div>
            </div>
        `;

        if (!isMatch && bestPhoneticFeedback) {
            resEl.innerHTML = `
                ${heardHtml}
                <span class='text-orange-600 font-bold text-lg'><i class='fas fa-exclamation-triangle mr-2'></i>发音存在偏差 (Phát âm chưa chuẩn)</span>
                <br><span class="text-orange-800 text-sm mt-2 font-medium leading-relaxed block">
                💡 <b>系统检测到您对提示词的发音不够准确：</b><br>
                • ${bestPhoneticFeedback}
                <br><br>请结合结构提示再试一次！</span>
            `;
            resEl.className = "bg-orange-50 p-4 rounded-xl border border-orange-300 mt-2 shadow-inner min-h-[50px] transition-all";
            return;
        }

        if (cleanText.length > 0 && isMatch) {
            let isFullSentence = true;
            if (matchedTargetLength < 6 && cleanText.length < matchedTargetLength + 2) {
                isFullSentence = false;
            }
            
            if (isFullSentence) {
                resEl.innerHTML = `
                    ${heardHtml}
                    <span class='text-green-700 font-bold text-lg'><i class='fas fa-check-circle mr-2'></i>完全正确 (+20 XP)</span>
                `;
                resEl.className = "bg-green-100 p-4 rounded-xl border border-green-300 mt-2 shadow-inner min-h-[50px] transition-all";
                
                appData.score += 20;
                document.getElementById('global-score').innerText = appData.score;
                
                setTimeout(() => moveToNextQuestion(), 2000);
            } else {
                resEl.innerHTML = `
                    ${heardHtml}
                    <span class='text-orange-600 font-bold text-lg'><i class='fas fa-exclamation-triangle mr-2'></i>句子不完整 (Câu chưa hoàn chỉnh)</span>
                    <br><span class="text-orange-800 text-sm mt-1 font-medium block">💡 提示词/表达发音正确！但请加上主语或谓语，组成<b>一个完整的句子</b>！</span>
                `;
                resEl.className = "bg-orange-50 p-4 rounded-xl border border-orange-300 mt-2 shadow-inner min-h-[50px] transition-all";
            }
            
        } else if (cleanText.length > 0) {
            resEl.innerHTML = `
                ${heardHtml}
                <span class='text-red-600 font-bold'><i class='fas fa-times-circle mr-2'></i>缺少提示词或偏题太远，无法识别！ (Thiếu从词或偏题太远)</span>
            `;
            resEl.className = "bg-red-50 p-4 rounded-xl border border-red-200 mt-2 shadow-inner min-h-[50px] transition-all";
        }
    }

    let shadowingRec = null;
    let activeShadowingId = null;
    let activeShadowingTarget = "";

    if (window.SpeechRecognition || window.webkitSpeechRecognition) {
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        shadowingRec = new SR();
        shadowingRec.lang = 'zh-CN';
        shadowingRec.continuous = false;
        shadowingRec.interimResults = false;

        shadowingRec.onresult = function(event) {
            const transcript = event.results[0][0].transcript;
            const resEl = document.getElementById(activeShadowingId);
            
            if(resEl && activeShadowingTarget) {
                let cleanTarget = activeShadowingTarget.replace(/[^一-龥a-zA-Z0-9]/g, "");
                let cleanTranscript = transcript.replace(/[^一-龥a-zA-Z0-9]/g, "");
                
                let resultHTML = "";
                let tIdx = 0;
                let correctCount = 0;
                
                for (let i = 0; i < cleanTarget.length; i++) {
                    let charT = cleanTarget[i];
                    let found = false;
                    let matchIdx = -1;
                    
                    for (let j = tIdx; j < Math.min(tIdx + 3, cleanTranscript.length); j++) {
                        if (charT === cleanTranscript[j]) {
                            found = true;
                            matchIdx = j;
                            break;
                        }
                    }
                    
                    if (found) {
                        resultHTML += `<span class="text-green-600">${charT}</span>`;
                        tIdx = matchIdx + 1;
                        correctCount++;
                    } else {
                        let charR = cleanTranscript[tIdx] || "";
                        let errorType = "";
                        
                        if (!charR) {
                            errorType = "漏读 (Bạn đọc thiếu chữ/âm)";
                        } else {
                            try {
                                if (typeof pinyinPro !== 'undefined') {
                                    let pyT_num = pinyinPro.pinyin(charT, { toneType: 'num', type: 'array' })[0] || "";
                                    let pyR_num = pinyinPro.pinyin(charR, { toneType: 'num', type: 'array' })[0] || "";
                                    let initT = pinyinPro.pinyin(charT, { pattern: 'initial', type: 'array' })[0] || "";
                                    let initR = pinyinPro.pinyin(charR, { pattern: 'initial', type: 'array' })[0] || "";
                                    let finalT = pinyinPro.pinyin(charT, { pattern: 'final', type: 'array' })[0] || "";
                                    let finalR = pinyinPro.pinyin(charR, { pattern: 'final', type: 'array' })[0] || "";
                                    let baseT = pyT_num.replace(/\d/g, ''); let baseR = pyR_num.replace(/\d/g, '');
                                    
                                    if (baseT === baseR && pyT_num !== pyR_num) errorType = "声调错误 (Sai thanh điệu, bạn đọc thành " + charR + ")";
                                    else if (initT !== initR && finalT === finalR) errorType = "声母错误 (Sai thanh mẫu, bạn đọc thành " + charR + ")";
                                    else if (initT === initR && finalT !== finalR) errorType = "韵母错误 (Sai vận mẫu, bạn đọc thành " + charR + ")";
                                    else errorType = "发音错误 (Sai hoàn toàn, bạn đọc thành " + charR + ")";
                                } else {
                                    errorType = "发音错误 (Sai phát âm)";
                                }
                            } catch(e) {
                                errorType = "发音错误";
                            }
                            tIdx++; 
                        }

                        resultHTML += `
                            <span class="relative group cursor-pointer text-red-500 font-bold border-b-2 border-red-500 mx-[1px]">
                                ${charT}
                                <span class="absolute bottom-full left-1/2 transform -translate-x-1/2 mb-1 hidden group-hover:block bg-gray-800 text-white text-xs whitespace-nowrap px-2 py-1 rounded z-10 shadow-lg">
                                    ${errorType}
                                </span>
                            </span>
                        `;
                    }
                }
                
                let extraWordsHTML = "";
                if (tIdx < cleanTranscript.length) {
                    let extraChars = cleanTranscript.substring(tIdx);
                    extraWordsHTML = `<div class="mt-2 text-xs text-orange-500"><i class="fas fa-info-circle mr-1"></i>读多了 (Bạn đọc thừa/lệch âm): "${extraChars}"</div>`;
                }

                let accuracy = cleanTarget.length > 0 ? Math.round((correctCount / cleanTarget.length) * 100) : 0;
                let scoreColor = accuracy >= 80 ? 'text-green-600' : (accuracy >= 50 ? 'text-orange-500' : 'text-red-500');

                resEl.innerHTML = `
                    <div class="mb-1 text-xs text-gray-500"><i class="fas fa-microphone-alt mr-1"></i>系统识别 (Hệ thống nghe được): ${transcript}</div>
                    <div class="text-lg tracking-wider">${resultHTML}</div>
                    ${extraWordsHTML}
                    <div class="text-xs font-bold mt-1 ${scoreColor}">准确率 (Độ chính精确): ${accuracy}% <span class="text-gray-400 font-normal ml-2">(Di chuột vào chữ đỏ để xem chi tiết)</span></div>
                `;
            }
            resetShadowingMicBtn(activeShadowingId);
        };

        shadowingRec.onerror = function(event) {
            const resEl = document.getElementById(activeShadowingId);
            if(resEl) resEl.innerHTML = `<span class="text-red-500 text-sm"><i class="fas fa-exclamation-circle mr-1"></i>听不清楚，请重试！</span>`;
            resetShadowingMicBtn(activeShadowingId);
        };
        
        shadowingRec.onend = function() {
            resetShadowingMicBtn(activeShadowingId);
        }
    }

    function resetShadowingMicBtn(id) {
        if(!id) return;
        const btnId = id.replace('s-res-', 'btn-smic-');
        const btn = document.getElementById(btnId);
        if(btn) {
            btn.classList.remove('bg-red-500', 'pulse-anim', 'mic-active-icon');
            btn.classList.add('bg-green-500');
            btn.innerHTML = '<i class="fas fa-microphone"></i>';
        }
        activeShadowingId = null;
    }

    function playSentence(text) {
        if (!window.speechSynthesis) return;
        window.speechSynthesis.cancel();
        let u = new SpeechSynthesisUtterance(text);
        u.lang = 'zh-CN'; // Force zh-CN exclusively
        u.rate = 0.85; 
        u.pitch = 1.0; 
        if(chineseVoice) u.voice = chineseVoice;
        window.speechSynthesis.speak(u);
    }

    function startShadowing(resId, btnId, targetText) {
        if (!shadowingRec) {
            alert("Trình duyệt不支持Web Speech API。请使用 Chrome。");
            return;
        }

        if(window.speechSynthesis) window.speechSynthesis.cancel();
        
        if(activeShadowingId && activeShadowingId !== resId) {
            resetShadowingMicBtn(activeShadowingId);
            try { shadowingRec.stop(); } catch(e){}
        }

        activeShadowingId = resId;
        activeShadowingTarget = targetText; 
        
        const btn = document.getElementById(btnId);
        const resEl = document.getElementById(resId);
        
        btn.classList.remove('bg-green-500');
        btn.classList.add('bg-red-500', 'mic-active-icon');
        btn.innerHTML = '<i class="fas fa-microphone-slash"></i>';
        
        resEl.innerHTML = `<span class="text-blue-500 text-sm italic">正在聆听...</span>`;
        
        try { shadowingRec.start(); } catch(e){}
    }

    function loadLocalAudio(event) {
        const file = event.target.files[0];
        if (!file) return;
        const audioEl = document.getElementById('lesson-audio');
        
        if (audioEl.src && audioEl.src.startsWith('blob:')) {
            URL.revokeObjectURL(audioEl.src);
        }
        
        audioEl.src = URL.createObjectURL(file);
        audioEl.classList.remove('hidden');
    }

    function switchView(viewId, element) {
        if(practiceRec) { try { practiceRec.stop(); } catch(e){} }
        if(shadowingRec) { try { shadowingRec.stop(); } catch(e){} }
        
        const realAudio = document.getElementById('lesson-audio');
        if(realAudio) {
            realAudio.pause();
        }

        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
        if(element) element.classList.add('active');

        const parts = viewId.split('-');
        const lesson = parts[0]; 
        const type = parts[1];   
        
        let html = '';
        if (type === 'reading') html = renderReading(lesson, 'normal');
        else if (type === 'vocab') html = renderVocabList(lesson, 0, 999, '词汇 (Flashcards)');
        else if (type === 'practice') html = renderPractice(lesson, 'exercises', '练习一 (情景表达)');
        else if (type === 'practice2') html = renderPractice(lesson, 'exercises2', '练习二 (夸奖/称赞)');

        contentArea.innerHTML = html;
        window.scrollTo(0, 0);
        if (typeof populateVoiceSelect === 'function') {
            setTimeout(populateVoiceSelect, 100);
        }
    }

        const data = appData[lesson];
        
        let navHtml = `
            <div class="flex gap-4 border-b border-gray-200 mb-6">
                <button class="pb-2 ${mode==='normal' ? 'border-b-2 border-blue-600 font-bold text-blue-600' : 'font-bold text-gray-500 hover:text-gray-800'}" onclick="renderReadingTab('${lesson}', 'normal')">📖 朗读全文</button>
                <button class="pb-2 ${mode==='shadowing' ? 'border-b-2 border-blue-600 font-bold text-blue-600' : 'font-bold text-gray-500 hover:text-gray-800'}" onclick="renderReadingTab('${lesson}', 'shadowing')">🗣️ 跟读练习</button>

                p.lines.forEach((line, lIndex) => {

                    shadowHtml += `
                        <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 mb-3 flex flex-col md:flex-row md:items-center gap-4 transition hover:shadow-md">

                            <div class="flex items-center gap-3 shrink-0">
                                <button class="w-10 h-10 rounded-full bg-blue-100 text-blue-600 hover:bg-blue-200 flex items-center justify-center transition relative group" onclick="playSentence('${safeText}')">
                                    <i class="fas fa-volume-up"></i>
                                    <span class="absolute bottom-full mb-2 hidden group-hover:block bg-gray-800 text-white text-xs px-2 py-1 rounded whitespace-nowrap">听AI发音</span>
                                </button>
                                <button id="${btnId}" class="w-10 h-10 rounded-full bg-green-500 text-white hover:bg-green-600 flex items-center justify-center transition shadow-sm relative group" onclick="startShadowing('${sId}', '${btnId}', '${safeText}')">
                                    <i class="fas fa-microphone"></i>
                                    <span class="absolute bottom-full mb-2 hidden group-hover:block bg-gray-800 text-white text-xs px-2 py-1 rounded whitespace-nowrap">跟读录音</span>
                                </button>
                            </div>
                            <div id="${sId}" class="w-full md:w-1/3 text-sm text-gray-500 md:text-right mt-2 md:mt-0 min-h-[40px] flex flex-col items-end justify-center">

            return `
                <div class="section-header">

                </div>

    function renderReadingTab(lesson, mode) {
        contentArea.innerHTML = renderReading(lesson, mode);
    }

    function renderPractice(lesson, exerciseKey, title) {
        const data = appData[lesson][exerciseKey];
        if (!data) return `<p class="text-gray-500">暂无练习数据。</p>`;

        window.currentPracticeLesson = lesson;
        window.currentPracticeKey = exerciseKey;
        window.activeQIndex = 0;

        let quizzesHtml = '';
        
        data.forEach((q, index) => {
            const opacityClass = 'opacity-100 border-2 border-gray-100'; 
            let labelBadge = exerciseKey === 'exercises' ? '提示表达' : '参考例句';
            
            quizzesHtml += `
                <div id="q-block-${index}" class="bg-white p-6 rounded-2xl shadow-sm mb-6 transition-all duration-500 ${opacityClass}">
                    <div class="flex items-start gap-4">
                        <div id="q-num-${index}" class="w-10 h-10 rounded-full bg-blue-500 text-white flex items-center justify-center font-bold shrink-0 mt-1 transition-colors duration-500 shadow-sm">${index + 1}</div>
                        <div class="flex-1 w-full">
                            <p class="text-lg text-gray-800 font-medium mb-2 leading-relaxed">${q.q}</p>
                            
                            <p class="text-[1.05rem] text-blue-700 font-medium mb-4 flex items-center flex-wrap gap-2">
                                <i class="fas fa-key mr-1"></i> ${exerciseKey === 'exercises2' ? '提示表达：' : '提示词：'} 
                                <span class="bg-blue-100 px-3 py-1 rounded-md border border-blue-200 font-bold">${q.hint}</span>
                            </p>
                            
                            <div class="flex flex-wrap gap-3 mb-3">
                                <button id="btn-pmic-${index}" class="bg-blue-600 text-white border border-blue-700 px-5 py-2.5 rounded-lg hover:bg-blue-700 shadow-sm font-bold flex items-center transition" 
                                        onclick="startPracticeMic('${index}')">
                                    <i class="fas fa-microphone mr-2"></i> 点击录音
                                </button>
                                <button class="bg-yellow-100 text-yellow-800 border border-yellow-300 px-5 py-2.5 rounded-lg hover:bg-yellow-200 shadow-sm font-bold flex items-center transition" 
                                        onclick="toggleHint('${index}')">
                                    <i class="fas fa-lightbulb text-yellow-500 mr-2"></i> 参考答案
                                </button>
                                <button class="bg-gray-100 text-gray-600 border border-gray-300 px-5 py-2.5 rounded-lg hover:bg-gray-200 shadow-sm font-bold flex items-center transition" 
                                        onclick="skipQuestion('${index}')">
                                    <i class="fas fa-forward mr-2"></i> 跳过
                                </button>
                            </div>
                            
                            <div id="hint-${index}" class="hidden bg-yellow-50 border border-yellow-200 p-4 rounded-lg text-yellow-900 mb-3 shadow-inner">
                                <div class="flex items-start"><span class="bg-orange-200 text-orange-800 px-2 py-1 rounded text-xs font-bold mr-3 mt-1 shadow-sm shrink-0">${labelBadge}：</span> 
                                    <div class="text-gray-800 font-medium text-lg leading-relaxed">${q.deepHint}</div>
                                </div>
                            </div>
                            
                            <div id="res-${index}" class="mt-2 min-h-[50px] transition-all duration-300">
                                <span class="text-gray-400 italic">请点击上方“点击录音”按钮并授权麦克风以开始回答。</span>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        });

        return `
            <div class="section-header">
                <i class="fas fa-bolt text-yellow-500 mr-2"></i> ${title}
            </div>
            
            <div class="mb-6 bg-gradient-to-r from-blue-50 to-indigo-50 border border-blue-200 p-5 rounded-2xl flex flex-col sm:flex-row justify-between items-center gap-4 shadow-sm">
                <div>
                    <h3 class="font-bold text-blue-800 text-lg mb-1"><i class="fas fa-headset mr-2 text-blue-500"></i>练习规则</h3>
                    <p class="text-sm text-blue-700">1. 阅读问题并使用 <b>${exerciseKey === 'exercises2' ? '提示表达' : '提示词'}</b> 造一个完整的句子。<br>2. 您可以自由选择任意题目，<b>点击“录音”按钮</b>进行语音识别。系统将自动反馈发音及拼音结果。</p>
                </div>
            </div>

            <div class="max-w-3xl pb-10">
                ${quizzesHtml}
            </div>
        `;
    }

    function toggleHint(index) {
        const el = document.getElementById('hint-' + index);
        if (el.classList.contains('hidden')) {
            el.classList.remove('hidden');
        } else {
            el.classList.add('hidden');
        }
    }

    function skipQuestion(index) {
        const resEl = document.getElementById('res-' + index);
        resEl.innerHTML = `<span class='text-gray-700 font-medium'><i class='fas fa-forward mr-2 text-blue-500'></i>已跳过。请参考提示。</span>`;
        resEl.className = "bg-gray-100 p-4 rounded-xl border border-gray-300 shadow-inner mt-2 min-h-[50px]";
    }

    function moveToNextQuestion() {
        const currIdx = window.activeQIndex;
        const currNum = document.getElementById('q-num-' + currIdx);
        
        if (currNum) {
            currNum.classList.replace('bg-blue-500', 'bg-green-500');
            currNum.innerHTML = '<i class="fas fa-check"></i>';
        }
        
        window.activeQIndex++;
        
        const exercises = appData[window.currentPracticeLesson][window.currentPracticeKey];
        if (window.activeQIndex < exercises.length) {
            const nextIdx = window.activeQIndex;
            const nextBlock = document.getElementById('q-block-' + nextIdx);
            
            if (nextBlock) {
                setTimeout(() => {
                    nextBlock.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }, 100);
            }
        }
    }

    window.onload = () => {
        switchView('b6-reading', document.querySelector('.nav-item'));
    };
</script>
</body>
</html>
